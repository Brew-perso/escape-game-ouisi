<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="stoneBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="70%" stop-color="#0c0a09" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>

    <!-- Wax Seal Gradient -->
    <radialGradient id="waxSeal" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="60%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#450a0a" />
    </radialGradient>

    <!-- Antique Gold Gradient -->
    <linearGradient id="antiqueGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Gold Shadow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Stone Rounded Slate -->
  <rect width="512" height="512" rx="108" fill="url(#stoneBg)" stroke="#d97706" stroke-width="6" stroke-opacity="0.4" />

  <!-- Outer Celtic / Runic Ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#antiqueGold)" stroke-width="4" stroke-dasharray="8 6" opacity="0.6" />
  <circle cx="256" cy="256" r="202" fill="none" stroke="url(#antiqueGold)" stroke-width="2" opacity="0.4" />

  <!-- Wax Seal Outer Disc -->
  <circle cx="256" cy="256" r="172" fill="url(#waxSeal)" filter="url(#goldGlow)" />
  <circle cx="256" cy="256" r="162" fill="none" stroke="url(#antiqueGold)" stroke-width="4" opacity="0.8" />

  <!-- Medieval Knight Shield / Grimoire Symbol in Center -->
  <g transform="translate(256, 256) scale(1.15)">
    <!-- Heraldic Shield Outline -->
    <path d="M 0 -85 C 45 -85, 80 -70, 80 -40 C 80 40, 45 85, 0 105 C -45 85, -80 40, -80 -40 C -80 -70, -45 -85, 0 -85 Z"
          fill="#1c1917" stroke="url(#antiqueGold)" stroke-width="7" />

    <!-- Open Grimoire Tome within Shield -->
    <!-- Left Page -->
    <path d="M -5 -35 C -25 -45, -55 -40, -60 -35 L -60 30 C -55 25, -25 20, -5 30 Z"
          fill="#fef3c7" fill-opacity="0.9" stroke="url(#antiqueGold)" stroke-width="3" />
    <!-- Right Page -->
    <path d="M 5 -35 C 25 -45, 55 -40, 60 -35 L 60 30 C 55 25, 25 20, 5 30 Z"
          fill="#fde68a" fill-opacity="0.9" stroke="url(#antiqueGold)" stroke-width="3" />

    <!-- Quill / Sacred Feather Crossing -->
    <path d="M -20 40 L 45 -55 C 50 -62, 58 -60, 55 -50 L 35 -15 L -20 40 Z"
          fill="url(#antiqueGold)" />
    <!-- Quill Nib Tip -->
    <polygon points="-20,40 -26,48 -18,44" fill="#fef3c7" />

    <!-- Mystic Star above Grimoire -->
    <polygon points="0,-58 4,-48 14,-48 6,-42 9,-32 0,-38 -9,-32 -6,-42 -14,-48 -4,-48"
             fill="url(#antiqueGold)" />
  </g>

  <!-- Four Cardinal Compass Runes -->
  <circle cx="256" cy="46" r="6" fill="url(#antiqueGold)" />
  <circle cx="256" cy="466" r="6" fill="url(#antiqueGold)" />
  <circle cx="46" cy="256" r="6" fill="url(#antiqueGold)" />
  <circle cx="466" cy="256" r="6" fill="url(#antiqueGold)" />
</svg>